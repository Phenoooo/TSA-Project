<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Scroll</title>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #10131a;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.question {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 30px;
    text-align: center;
    border-top: 1px solid #303747;
}

.question.locked {
    display: none;
}

.question h1 {
    font-size: 45px;
}

input {
    padding: 15px;
    font-size: 18px;
    width: 180px;
    border-radius: 8px;
    border: none;
}

button {
    padding: 15px 22px;
    margin: 10px;
    background: #72a7ff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.feedback {
    margin-top: 20px;
    min-height: 25px;
}

.correct {
    color: #70e6a0;
}

.incorrect {
    color: #ff7777;
}

.progress {
    position: fixed;
    top: 0;
    left: 0;
    height: 5px;
    background: #72a7ff;
    width: 0%;
    z-index: 10;
}
</style>
</head>

<body>

<div class="progress" id="progress"></div>

<header>
    <h1>Math Scroll</h1>
    <p>Answer correctly to unlock the next question.</p>
    <p>Scroll down to begin ↓</p>
</header>

<div id="questions"></div>

<script>
const questions = [
    { question: "12 × 8", answer: 96 },
    { question: "144 ÷ 12", answer: 12 },
    { question: "15²", answer: 225 },
    { question: "25 × 4", answer: 100 },
    { question: "√169", answer: 13 },
    { question: "18 × 7", answer: 126 },
    { question: "250 ÷ 5", answer: 50 },
    { question: "19²", answer: 361 }
];

let unlocked = 0;

const container = document.getElementById("questions");

function createQuestion(index) {
    const section = document.createElement("section");
    section.className = "question";
    section.id = "question-" + index;

    section.innerHTML = `
        <h2>QUESTION ${index + 1} / ${questions.length}</h2>
        <h1>${questions[index].question} = ?</h1>
        <div>
            <input type="number" id="answer-${index}" placeholder="Your answer">
            <button id="submit-${index}">Submit</button>
        </div>
        <p class="feedback" id="feedback-${index}"></p>
    `;

    container.appendChild(section);

    const input = section.querySelector("input");
    const button = section.querySelector("button");
    const feedback = section.querySelector(".feedback");

    function checkAnswer() {
        if (input.value.trim() === "") {
            feedback.textContent = "Enter an answer first.";
            feedback.className = "feedback incorrect";
            return;
        }

        if (Number(input.value) === questions[index].answer) {
            feedback.textContent = "Correct! Scroll down when you're ready.";
            feedback.className = "feedback correct";

            input.disabled = true;
            button.disabled = true;

            unlocked++;

            if (unlocked < questions.length) {
                createQuestion(unlocked);
            } else {
                showCompletion();
            }

            updateProgress();
        } else {
            feedback.textContent = "Incorrect! Try again.";
            feedback.className = "feedback incorrect";
        }
    }

    button.addEventListener("click", checkAnswer);

    input.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            checkAnswer();
        }
    });
}

function updateProgress() {
    document.getElementById("progress").style.width =
        (unlocked / questions.length * 100) + "%";
}

function showCompletion() {
    const section = document.createElement("section");
    section.className = "question";

    section.innerHTML = `
        <h1>Congratulations!</h1>
        <p>You completed all ${questions.length} questions!</p>
        <button id="restart">Restart</button>
    `;

    container.appendChild(section);

    document.getElementById("restart").addEventListener("click", function() {
        location.reload();
    });
}

createQuestion(0);
</script>

</body>
</html>
